<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LyricDeck Remote</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎙️</text></svg>">
<style>
    :root { --accent-color: #1DB954; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #0a0a0a; color: #fff; font-family: 'Segoe UI', sans-serif; padding: 16px; max-width: 640px; margin-left: auto; margin-right: auto; }
    h1 { font-size: 1.5rem; margin: 0 0 4px 0; }
    h2 { font-size: 1.1rem; margin: 24px 0 8px 0; color: var(--accent-color); text-transform: uppercase; letter-spacing: 1px; }
    #now-playing { background: #141414; border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 14px 16px; margin-bottom: 8px; }
    #np-title { font-weight: 800; font-size: 1.1rem; }
    #np-artist { color: var(--accent-color); font-weight: 600; margin-top: 2px; }
    .row { display: flex; gap: 8px; margin-top: 12px; }
    input { flex: 1; padding: 12px; background: #18181b; border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; color: #fff; font-size: 1rem; outline: none; }
    input:focus { border-color: var(--accent-color); }
    button { background: var(--accent-color); color: #000; font-weight: 700; border: none; border-radius: 8px; padding: 12px 18px; font-size: 1rem; cursor: pointer; }
    button.ghost { background: rgba(255,255,255,0.08); color: #fff; }
    button.danger { background: rgba(255,80,80,0.15); color: #ff8080; border: 1px solid rgba(255,80,80,0.4); }
    .item { background: #141414; border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; padding: 12px 14px; margin-bottom: 8px; display: flex; align-items: center; gap: 10px; }
    .item .meta { flex: 1; min-width: 0; }
    .item .t { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .item .a { font-size: 0.85rem; color: rgba(255,255,255,0.55); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .item button { padding: 8px 12px; font-size: 0.85rem; flex-shrink: 0; }
    .empty { color: rgba(255,255,255,0.4); font-size: 0.95rem; padding: 8px 0; }
    #who { width: 100%; margin-top: 12px; }
    .duet-line { padding: 10px 12px; border-radius: 8px; margin-bottom: 4px; background: #141414; cursor: pointer; border-left: 4px solid transparent; }
    .duet-line .part-tag { float: right; font-size: 0.75rem; font-weight: 800; padding: 2px 8px; border-radius: 10px; }
    .duet-line[data-part="A"] { border-left-color: #22d3ee; }
    .duet-line[data-part="A"] .part-tag { background: rgba(34,211,238,0.2); color: #22d3ee; }
    .duet-line[data-part="B"] { border-left-color: #f472b6; }
    .duet-line[data-part="B"] .part-tag { background: rgba(244,114,182,0.2); color: #f472b6; }
    .duet-line[data-part="both"] .part-tag { background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.6); }
    .duet-line.mine { background: #1a1a1a; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.15); }
    .singer-on { background: var(--accent-color) !important; color: #000 !important; }
    #duet-lyrics { max-height: 50vh; overflow-y: auto; }
    .duet-line.now { outline: 2px solid #fff; }
    .duet-line.now.mine { outline-color: var(--accent-color); background: #1e2a1e; }
    #duet-getready { display: none; background: linear-gradient(135deg, rgba(29,185,84,0.25), rgba(29,185,84,0.08));
        border: 1px solid var(--accent-color); border-radius: 12px; padding: 12px 16px; margin-bottom: 10px;
        animation: grPulse 1s ease-in-out infinite; }
    #duet-getready.show { display: block; }
    #duet-getready .gr-label { font-weight: 900; letter-spacing: 2px; color: var(--accent-color); font-size: 0.85rem; }
    #duet-getready .gr-line { font-weight: 700; font-size: 1.05rem; margin-top: 4px; }
    @keyframes grPulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.02); } }
</style>
</head>
<body>
    <h1>LyricDeck Remote <a href="/help" style="font-size:1rem;color:var(--accent-color);text-decoration:none;" title="Help">?</a></h1>

    <div id="join-card" style="display:none; background:#141414; border:1px solid var(--accent-color); border-radius:12px; padding:18px; margin-bottom:16px;">
        <h2 style="margin-top:0;">Join the Party</h2>
        <p style="color:rgba(255,255,255,0.6); font-size:0.9rem;">Enter the 4-letter code from the party screen. No Plex login needed.</p>
        <div class="row">
            <input id="join-code" placeholder="Code" maxlength="4" style="text-transform:uppercase; max-width:110px; text-align:center; font-weight:800; letter-spacing:2px;">
            <input id="join-name" placeholder="Your name" maxlength="40">
        </div>
        <div class="row"><button onclick="joinSession()" style="width:100%;">Join</button></div>
        <div id="join-error" class="empty" style="color:#ff8080; display:none;"></div>
    </div>
    <div id="linked-bar" style="display:none; margin-bottom:12px; font-size:0.9rem; color:rgba(255,255,255,0.6);">
        Joined as <b id="linked-name" style="color:#fff;"></b> <span id="linked-singer" style="color:var(--accent-color);"></span>
        <a href="#" onclick="leaveSession(); return false;" style="color:rgba(255,255,255,0.4); margin-left:8px;">leave</a>
    </div>

    <h2>Now Playing</h2>
    <div id="now-playing">
        <div id="np-title">Nothing playing</div>
        <div id="np-artist"></div>
    </div>

    <h2>Duet Mode</h2>
    <div class="row" style="margin-top:0;" id="singer-row" style="display:none;">
        <button id="singer-a-btn" class="ghost" onclick="setSinger('A')">I sing A</button>
        <button id="singer-b-btn" class="ghost" onclick="setSinger('B')">I sing B</button>
    </div>
    <div id="duet-getready"><div class="gr-label">GET READY</div><div class="gr-line" id="duet-gr-line"></div></div>
    <div id="duet-lyrics" style="display:none; margin-top:12px;"></div>
    <div class="row" id="duet-clear-row" style="display:none;">
        <button class="ghost" onclick="autoSplit(true)">Auto-split parts</button>
        <button class="danger ghost" onclick="clearDuetParts()">Clear</button>
    </div>

    <h2>Search and Queue</h2>
    <input id="who" placeholder="Your name (for the queue)">
    <div class="row">
        <input id="q-artist" placeholder="Artist">
        <input id="q-title" placeholder="Title">
        <button onclick="search()">Search</button>
    </div>
    <div id="results" style="margin-top:12px;"></div>

    <h2>Party Queue <span id="q-count"></span></h2>
    <div id="queue"></div>
    <div class="row">
        <button class="danger ghost" onclick="clearQueue()" style="width:100%;">Clear queue</button>
    </div>

<script>
    async function refreshState() {
        try {
            const res = await fetch('/api/party/state');
            const data = await res.json();
            document.getElementById('np-title').innerText = data.playing ? (data.title || '') : 'Nothing playing';
            document.getElementById('np-artist').innerText = data.playing ? (data.artist || '') : '';
            const q = data.queue || [];
            document.getElementById('q-count').innerText = q.length ? `(${q.length})` : '';
            const qEl = document.getElementById('queue');
            qEl.innerHTML = q.length === 0
                ? '<div class="empty">Queue is empty. Search above to add songs.</div>'
                : q.map((item, i) => `
                    <div class="item">
                        <div class="meta">
                            <div class="t">${escapeHtml(item.title)}</div>
                            <div class="a">${escapeHtml(item.artist)}${item.addedBy ? ' &middot; ' + escapeHtml(item.addedBy) : ''}</div>
                        </div>
                        <button class="ghost" onclick="removeAt(${i})">Remove</button>
                    </div>`).join('');
        } catch (e) {}
    }

    function escapeHtml(s) {
        return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    async function search() {
        const artist = document.getElementById('q-artist').value.trim();
        const title = document.getElementById('q-title').value.trim();
        const box = document.getElementById('results');
        if (!artist && !title) { box.innerHTML = '<div class="empty">Enter an artist or title.</div>'; return; }
        box.innerHTML = '<div class="empty">Searching...</div>';
        try {
            const res = await fetch(`/api/search-lyrics?title=${encodeURIComponent(title)}&artist=${encodeURIComponent(artist)}`);
            const data = await res.json();
            if (!Array.isArray(data) || data.length === 0) {
                box.innerHTML = '<div class="empty">No synced lyrics found.</div>';
                return;
            }
            box.innerHTML = data.slice(0, 10).map(item => `
                <div class="item">
                    <div class="meta">
                        <div class="t">${escapeHtml(item.trackName)}</div>
                        <div class="a">${escapeHtml(item.artistName)} &middot; ${escapeHtml(item.albumName || 'Unknown Album')}</div>
                    </div>
                    <button onclick="queueSong(${item.id}, '${escapeHtml(item.trackName).replace(/'/g, "\\'")}', '${escapeHtml(item.artistName).replace(/'/g, "\\'")}')">Queue</button>
                </div>`).join('');
            box.dataset.results = JSON.stringify(data.slice(0, 10));
        } catch (e) {
            box.innerHTML = '<div class="empty">Search failed.</div>';
        }
    }

    async function queueSong(id, title, artist) {
        const addedBy = document.getElementById('who').value.trim() || 'guest';
        await fetch('/api/party/queue', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ title, artist, lrcId: id, addedBy })
        });
        refreshState();
    }

    async function removeAt(i) {
        await fetch('/api/party/queue/remove', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ index: i })
        });
        refreshState();
    }

    async function clearQueue() {
        if (!confirm('Clear the whole party queue?')) return;
        await fetch('/api/party/queue/clear', { method: 'POST' });
        refreshState();
    }

    let duetEnabled = false, duetParts = {}, duetTrackKey = '', duetParsed = [];
    let duetTimes = [], duetOffsetMs = 0, duetFetchedAt = 0, duetPlaying = false;
    let mySinger = localStorage.getItem('duet_singer') || 'A';

    function parseLRC(lrcText) {
        const lines = (lrcText || '').split('\n'), result = [], times = [];
        const regex = /\[(\d{2,}):(\d{2}\.\d{2,3})\](.*)/;
        for (const line of lines) {
            const m = line.match(regex);
            if (m) {
                const text = m[3].trim();
                if (text) {
                    result.push(text);
                    times.push((parseInt(m[1], 10) * 60 + parseFloat(m[2])) * 1000);
                }
            }
        }
        duetTimes = times;
        return result;
    }

    function syncSingerBtns() {
        document.getElementById('singer-a-btn').classList.toggle('singer-on', mySinger === 'A');
        document.getElementById('singer-b-btn').classList.toggle('singer-on', mySinger === 'B');
    }

    function setSinger(s) {
        mySinger = s;
        localStorage.setItem('duet_singer', s);
        syncSingerBtns();
        renderDuetLyrics();
    }

    function detectPartsAuto(texts) {
        const isParen = t => /^\(.*\)$/.test((t || '').trim());
        const parts = {};
        let pc = 0;
        texts.forEach((t, i) => { if (isParen(t)) { parts[i] = 'B'; pc++; } });
        if (texts.length < 6 || pc < 2 || pc / texts.length > 0.7) return {};
        return parts;
    }

    async function refreshDuet() {
        try {
            const res = await fetch('/api/party/state');
            const data = await res.json();
            duetTrackKey = data.playing ? `${data.artist} - ${data.title}` : '';
            duetParsed = data.playing && data.syncedLyrics ? parseLRC(data.syncedLyrics) : [];
            duetOffsetMs = data.offsetMs || 0;
            duetFetchedAt = data.fetchedAt || Date.now();
            duetPlaying = !!data.playing && data.playerState !== 'paused';
            if (duetTrackKey) {
                const dr = await fetch('/api/duet/state?trackKey=' + encodeURIComponent(duetTrackKey));
                const dj = await dr.json();
                duetEnabled = dj.enabled;
                duetParts = dj.parts || {};
            } else { duetParts = {}; }
            renderDuetLyrics();
        } catch (e) {}
    }

    function renderDuetLyrics() {
        const box = document.getElementById('duet-lyrics');
        const clearRow = document.getElementById('duet-clear-row');
        const singerRow = document.getElementById('singer-row');
        syncSingerBtns();
        // automatic: merge server parts with auto-detected parts
        const autoParts = detectPartsAuto(duetParsed);
        const merged = Object.assign({}, autoParts, duetParts);
        const hasParts = Object.keys(merged).length > 0;
        if (!hasParts || !duetParsed.length) {
            box.style.display = 'none';
            clearRow.style.display = 'none';
            singerRow.style.display = 'none';
            document.getElementById('duet-getready').classList.remove('show');
            box.innerHTML = '';
            return;
        }
        duetParts = merged;
        box.style.display = '';
        clearRow.style.display = '';
        singerRow.style.display = '';
        box.innerHTML = '<div class="empty" style="margin-bottom:8px;">Tap a line to assign it: both &rarr; A &rarr; B</div>' + duetParsed.map((text, i) => {
            const part = duetParts[i] || 'both';
            const mine = part === 'both' || part === mySinger;
            return `<div class="duet-line${mine ? ' mine' : ''}" data-part="${part}" onclick="cyclePart(${i})">
                <span class="part-tag">${part === 'both' ? 'BOTH' : part}</span>${escapeHtml(text)}</div>`;
        }).join('');
    }

    function duetNowMs() {
        if (!duetPlaying) return duetOffsetMs;
        return duetOffsetMs + (Date.now() - duetFetchedAt);
    }
    function duetCurrentIndex() {
        const now = duetNowMs();
        let idx = -1;
        for (let i = 0; i < duetTimes.length; i++) {
            if (now >= duetTimes[i]) idx = i; else break;
        }
        return idx;
    }
    function isMyPart(i) {
        const part = duetParts[i] || 'both';
        return part === 'both' || part === mySinger;
    }
    function updateDuetLive() {
        if (!duetParsed.length || Object.keys(duetParts).length === 0) {
            document.getElementById('duet-getready').classList.remove('show');
            return;
        }
        const idx = duetCurrentIndex();
        const box = document.getElementById('duet-lyrics');
        box.querySelectorAll('.duet-line').forEach((el, i) => el.classList.toggle('now', i === idx));
        const curEl = box.querySelector('.duet-line.now');
        if (curEl) curEl.scrollIntoView({ block: 'center', behavior: 'smooth' });
        // get-ready: my next line within 8s while current isn't mine
        const gr = document.getElementById('duet-getready');
        const now = duetNowMs();
        let showGr = false, grText = '', grIn = 0;
        if (idx >= 0 && !isMyPart(idx)) {
            for (let i = idx + 1; i < duetTimes.length; i++) {
                if (isMyPart(i)) {
                    const waitMs = duetTimes[i] - now;
                    if (waitMs > 0 && waitMs <= 8000) { showGr = true; grText = duetParsed[i]; grIn = waitMs; }
                    break;
                }
            }
        }
        gr.classList.toggle('show', showGr);
        if (showGr) document.getElementById('duet-gr-line').innerText = `"${grText}" — in ${Math.ceil(grIn / 1000)}s`;
    }
    setInterval(updateDuetLive, 1000);

    async function cyclePart(i) {
        const cur = duetParts[i] || 'both';
        const next = cur === 'both' ? 'A' : cur === 'A' ? 'B' : 'both';
        await fetch('/api/duet/assign', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ trackKey: duetTrackKey, index: i, part: next })
        });
        refreshDuet();
    }

    function autoSplitHeuristic(texts) {
        const isParen = t => /^\(.*\)$/.test(t.trim());
        const parenIdx = [];
        texts.forEach((t, i) => { if (isParen(t)) parenIdx.push(i); });
        if (texts.length < 6 || parenIdx.length < 2) return null;
        if (parenIdx.length / texts.length > 0.7) return null;
        const parts = {};
        parenIdx.forEach(i => parts[i] = 'B');
        return parts;
    }
    async function autoSplit(manual) {
        if (!duetTrackKey || !duetParsed.length) return;
        const parts = autoSplitHeuristic(duetParsed);
        if (!parts) {
            if (manual) alert('No clear two-part pattern found in these lyrics.');
            return false;
        }
        await fetch('/api/duet/setparts', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ trackKey: duetTrackKey, parts })
        });
        refreshDuet();
        return true;
    }
    async function clearDuetParts() {
        if (!confirm('Clear all part assignments for this song?')) return;
        await fetch('/api/duet/clear', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ trackKey: duetTrackKey })
        });
        refreshDuet();
    }

    async function joinSession() {
        const code = document.getElementById('join-code').value.trim();
        const name = document.getElementById('join-name').value.trim();
        const err = document.getElementById('join-error');
        err.style.display = 'none';
        if (!code || !name) { err.innerText = 'Enter the code and your name.'; err.style.display = ''; return; }
        try {
            const res = await fetch('/api/session/join', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ code, name })
            });
            const data = await res.json();
            if (!res.ok) { err.innerText = data.error || 'Could not join.'; err.style.display = ''; return; }
            localStorage.setItem('linked_name', data.name);
            if (data.singer) setSinger(data.singer);
            document.getElementById('who').value = data.name;
            syncJoinUI();
        } catch (e) { err.innerText = 'Could not reach the server.'; err.style.display = ''; }
    }
    async function leaveSession() {
        const name = localStorage.getItem('linked_name');
        if (name) await fetch('/api/session/leave', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name })
        });
        localStorage.removeItem('linked_name');
        syncJoinUI();
    }
    function syncJoinUI() {
        const name = localStorage.getItem('linked_name');
        document.getElementById('join-card').style.display = name ? 'none' : '';
        document.getElementById('linked-bar').style.display = name ? '' : 'none';
        if (name) {
            document.getElementById('linked-name').innerText = name;
            document.getElementById('who').value = name;
        }
    }
    syncJoinUI();

    refreshState();
    setInterval(refreshState, 3000);
    refreshDuet();
    setInterval(refreshDuet, 3000);
</script>
</body>
</html>
