<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LyricDeck Duet</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎤</text></svg>">
<style>
    :root { --accent-color: #1DB954; --part-a: #22d3ee; --part-b: #f472b6; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #0a0a0a; color: #fff; font-family: 'Segoe UI', sans-serif; padding: 16px; max-width: 640px; margin-left: auto; margin-right: auto; }
    h1 { font-size: 1.5rem; margin: 0 0 4px 0; }
    h2 { font-size: 1.1rem; margin: 24px 0 8px 0; color: var(--accent-color); text-transform: uppercase; letter-spacing: 1px; }
    .row { display: flex; gap: 8px; margin-top: 12px; }
    input { flex: 1; padding: 12px; background: #18181b; border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; color: #fff; font-size: 1rem; outline: none; }
    input:focus { border-color: var(--accent-color); }
    button { background: var(--accent-color); color: #000; font-weight: 700; border: none; border-radius: 8px; padding: 12px 18px; font-size: 1rem; cursor: pointer; }
    button.ghost { background: rgba(255,255,255,0.08); color: #fff; }
    button.danger { background: rgba(255,80,80,0.15); color: #ff8080; border: 1px solid rgba(255,80,80,0.4); }
    .empty { color: rgba(255,255,255,0.4); font-size: 0.95rem; padding: 8px 0; }

    #join-card { background:#141414; border:1px solid var(--accent-color); border-radius:12px; padding:18px; margin-bottom:16px; }
    #join-card h2 { margin-top: 0; }
    #join-card p { color: rgba(255,255,255,0.6); font-size: 0.9rem; }
    #join-error { color:#ff8080; display:none; }
    #linked-bar { margin-bottom: 12px; font-size: 0.9rem; color: rgba(255,255,255,0.6); }
    #linked-bar a { color: rgba(255,255,255,0.4); margin-left: 8px; }

    /* Singer selector */
    #singer-row { margin: 12px 0; }
    #singer-row button { flex: 1; }
    #singer-a-btn.singer-on { background: var(--part-a); color: #000; }
    #singer-b-btn.singer-on { background: var(--part-b); color: #000; }
    #singer-badge { font-weight: 800; }

    /* Track header + main-display-style lyric stage */
    #duet-track { text-align: center; margin: 8px 0 4px 0; }
    #duet-title { font-size: 1.3rem; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #duet-artist { color: var(--accent-color); font-weight: 600; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #duet-stage { text-align: center; padding: 24px 8px; min-height: 30vh; display: flex; flex-direction: column; justify-content: center; }
    #duet-current { font-size: 2rem; font-weight: 800; line-height: 1.3; text-shadow: 0 2px 12px rgba(0,0,0,0.9); transition: opacity 0.25s ease, color 0.25s ease; }
    #duet-next { margin-top: 18px; font-size: 1.15rem; font-weight: 500; line-height: 1.35; opacity: 0.45; }
    #duet-current.dimmed { opacity: 0.28; font-weight: 500; }
    #duet-current.mine-a { color: var(--part-a); }
    #duet-current.mine-b { color: var(--part-b); }
    #duet-current.mine-both { color: #fff; }
    #duet-waiting { text-align: center; padding: 40px 0; }

    /* GET READY banner */
    #duet-getready { display: none; background: linear-gradient(135deg, rgba(29,185,84,0.25), rgba(29,185,84,0.08));
        border: 1px solid var(--accent-color); border-radius: 12px; padding: 12px 16px; margin: 0 0 10px 0;
        animation: grPulse 1s ease-in-out infinite; }
    #duet-getready.show { display: block; }
    #duet-getready .gr-label { font-weight: 900; letter-spacing: 2px; color: var(--accent-color); font-size: 0.85rem; }
    #duet-getready .gr-line { font-weight: 700; font-size: 1.05rem; margin-top: 4px; }
    @keyframes grPulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.02); } }

    /* Part editor (behind toggle) */
    #duet-editor { display: none; margin-top: 12px; }
    #duet-editor.open { display: block; }
    .duet-line { padding: 10px 12px; border-radius: 8px; margin-bottom: 4px; background: #141414; cursor: pointer; border-left: 4px solid transparent; }
    .duet-line .part-tag { float: right; font-size: 0.75rem; font-weight: 800; padding: 2px 8px; border-radius: 10px; }
    .duet-line[data-part="A"] { border-left-color: var(--part-a); }
    .duet-line[data-part="A"] .part-tag { background: rgba(34,211,238,0.2); color: var(--part-a); }
    .duet-line[data-part="B"] { border-left-color: var(--part-b); }
    .duet-line[data-part="B"] .part-tag { background: rgba(244,114,182,0.2); color: var(--part-b); }
    .duet-line[data-part="both"] .part-tag { background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.6); }
    .duet-line.now { outline: 2px solid #fff; }
</style>
</head>
<body>
    <h1>LyricDeck Duet <a href="/help" style="font-size:1rem;color:var(--accent-color);text-decoration:none;" title="Help">?</a></h1>

    <div id="join-card">
        <h2>Join the Party</h2>
        <p>Enter the 4-letter code from the party screen. No Plex login needed.</p>
        <div class="row">
            <input id="join-code" placeholder="Code" maxlength="4" style="text-transform:uppercase; max-width:110px; text-align:center; font-weight:800; letter-spacing:2px;">
            <input id="join-name" placeholder="Your name" maxlength="40">
        </div>
        <div class="row"><button onclick="joinSession()" style="width:100%;">Join</button></div>
        <div id="join-error" class="empty"></div>
    </div>
    <div id="linked-bar" style="display:none;">
        Joined as <b id="linked-name" style="color:#fff;"></b> <span id="singer-badge"></span>
        <a href="#" onclick="leaveSession(); return false;">leave</a>
    </div>

    <div id="duet-view" style="display:none;">
        <div id="duet-track">
            <div id="duet-title">Waiting for music...</div>
            <div id="duet-artist"></div>
        </div>

        <div class="row" id="singer-row">
            <button id="singer-a-btn" class="ghost" onclick="setSinger('A')">I sing A</button>
            <button id="singer-b-btn" class="ghost" onclick="setSinger('B')">I sing B</button>
        </div>

        <div id="duet-getready"><div class="gr-label">GET READY</div><div class="gr-line" id="duet-gr-line"></div></div>

        <div id="duet-stage">
            <div id="duet-waiting" class="empty">Start playing something on Plex or Jellyfin</div>
            <div id="duet-current" style="display:none;"></div>
            <div id="duet-next" style="display:none;"></div>
        </div>

        <div class="row">
            <button class="ghost" onclick="toggleEditor()" id="edit-toggle" style="width:100%;">Edit parts</button>
        </div>
        <div id="duet-editor">
            <div class="empty">Tap a line to assign it: both &rarr; A &rarr; B</div>
            <div id="duet-lines"></div>
            <div class="row">
                <button class="ghost" onclick="autoSplit(true)">Auto-split parts</button>
                <button class="danger ghost" onclick="clearDuetParts()">Clear</button>
            </div>
        </div>
    </div>

<script>
    function escapeHtml(s) {
        return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    let duetEnabled = false, duetParts = {}, duetTrackKey = '', duetParsed = [];
    let duetTimes = [], duetOffsetMs = 0, duetFetchedAt = 0, duetPlaying = false;
    let mySinger = localStorage.getItem('duet_singer') || 'A';

    function parseLRC(lrcText) {
        const lines = (lrcText || '').split('\n'), result = [], times = [];
        const regex = /\[(\d{2,}):(\d{2}\.\d{2,3})\](.*)/;
        for (const line of lines) {
            const m = line.match(regex);
            if (m) {
                const text = m[3].trim();
                if (text) {
                    result.push(text);
                    times.push((parseInt(m[1], 10) * 60 + parseFloat(m[2])) * 1000);
                }
            }
        }
        duetTimes = times;
        return result;
    }

    function syncSingerBtns() {
        document.getElementById('singer-a-btn').classList.toggle('singer-on', mySinger === 'A');
        document.getElementById('singer-b-btn').classList.toggle('singer-on', mySinger === 'B');
        const badge = document.getElementById('singer-badge');
        badge.innerText = mySinger === 'A' ? '(Singer A)' : '(Singer B)';
        badge.style.color = mySinger === 'A' ? 'var(--part-a)' : 'var(--part-b)';
    }

    function setSinger(s) {
        mySinger = s;
        localStorage.setItem('duet_singer', s);
        syncSingerBtns();
        renderLive();
    }

    function toggleEditor() {
        const ed = document.getElementById('duet-editor');
        ed.classList.toggle('open');
        document.getElementById('edit-toggle').innerText = ed.classList.contains('open') ? 'Hide part editor' : 'Edit parts';
        if (ed.classList.contains('open')) renderEditor();
    }

    function detectPartsAuto(texts) {
        const isParen = t => /^\(.*\)$/.test((t || '').trim());
        const parts = {};
        let pc = 0;
        texts.forEach((t, i) => { if (isParen(t)) { parts[i] = 'B'; pc++; } });
        if (texts.length < 6 || pc < 2 || pc / texts.length > 0.7) return {};
        return parts;
    }

    async function refreshDuet() {
        try {
            const res = await fetch('/api/party/state');
            const data = await res.json();
            const key = data.playing ? `${data.artist} - ${data.title}` : '';
            if (key !== duetTrackKey) {
                duetTrackKey = key;
                duetParsed = data.playing && data.syncedLyrics ? parseLRC(data.syncedLyrics) : [];
                if (document.getElementById('duet-editor').classList.contains('open')) renderEditor();
            }
            duetOffsetMs = data.offsetMs || 0;
            duetFetchedAt = data.fetchedAt || Date.now();
            duetPlaying = !!data.playing && data.playerState !== 'paused';
            if (data.playing) {
                document.getElementById('duet-title').innerText = data.title || '';
                document.getElementById('duet-artist').innerText = data.artist || '';
            } else {
                document.getElementById('duet-title').innerText = 'Waiting for music...';
                document.getElementById('duet-artist').innerText = '';
            }
            if (duetTrackKey) {
                const dr = await fetch('/api/duet/state?trackKey=' + encodeURIComponent(duetTrackKey));
                const dj = await dr.json();
                duetEnabled = dj.enabled;
                const serverParts = dj.parts || {};
                // automatic: merge server parts with auto-detected parts
                duetParts = Object.assign({}, detectPartsAuto(duetParsed), serverParts);
            } else {
                duetEnabled = false;
                duetParts = {};
            }
            renderLive();
        } catch (e) {}
    }

    function partOf(i) { return duetParts[i] || 'both'; }
    function isMyPart(i) { const p = partOf(i); return p === 'both' || p === mySinger; }

    function duetNowMs() {
        if (!duetPlaying) return duetOffsetMs;
        return duetOffsetMs + (Date.now() - duetFetchedAt);
    }
    function duetCurrentIndex() {
        const now = duetNowMs();
        let idx = -1;
        for (let i = 0; i < duetTimes.length; i++) {
            if (now >= duetTimes[i]) idx = i; else break;
        }
        return idx;
    }

    function renderLive() {
        const idx = duetCurrentIndex();
        const cur = document.getElementById('duet-current');
        const nxt = document.getElementById('duet-next');
        const waiting = document.getElementById('duet-waiting');
        if (idx >= 0 && duetParsed.length) {
            waiting.style.display = 'none';
            cur.style.display = '';
            nxt.style.display = '';
            const part = partOf(idx);
            const mine = isMyPart(idx);
            cur.innerText = duetParsed[idx];
            cur.className = mine ? (part === 'A' ? 'mine-a' : part === 'B' ? 'mine-b' : 'mine-both') : 'dimmed';
            const ni = idx + 1;
            if (ni < duetParsed.length) {
                nxt.innerText = duetParsed[ni];
                const nPart = partOf(ni);
                nxt.style.color = nPart === 'A' ? 'var(--part-a)' : nPart === 'B' ? 'var(--part-b)' : '';
                nxt.style.opacity = isMyPart(ni) ? '0.55' : '0.3';
            } else {
                nxt.innerText = '';
            }
        } else {
            waiting.style.display = '';
            cur.style.display = 'none';
            nxt.style.display = 'none';
        }
        // GET READY: my next line within 8s while the current line isn't mine
        const gr = document.getElementById('duet-getready');
        const now = duetNowMs();
        let showGr = false, grText = '', grIn = 0;
        if (idx >= 0 && !isMyPart(idx)) {
            for (let i = idx + 1; i < duetTimes.length; i++) {
                if (isMyPart(i)) {
                    const waitMs = duetTimes[i] - now;
                    if (waitMs > 0 && waitMs <= 8000) { showGr = true; grText = duetParsed[i]; grIn = waitMs; }
                    break;
                }
            }
        }
        gr.classList.toggle('show', showGr);
        if (showGr) document.getElementById('duet-gr-line').innerText = `"${grText}" — in ${Math.ceil(grIn / 1000)}s`;
        // keep editor "now" marker fresh if open
        if (document.getElementById('duet-editor').classList.contains('open')) {
            document.querySelectorAll('#duet-lines .duet-line').forEach((el, i) => el.classList.toggle('now', i === idx));
        }
    }

    function renderEditor() {
        const box = document.getElementById('duet-lines');
        const idx = duetCurrentIndex();
        box.innerHTML = duetParsed.map((text, i) => {
            const part = partOf(i);
            return `<div class="duet-line${i === idx ? ' now' : ''}" data-part="${part}" onclick="cyclePart(${i})">
                <span class="part-tag">${part === 'both' ? 'BOTH' : part}</span>${escapeHtml(text)}</div>`;
        }).join('') || '<div class="empty">No lyrics loaded.</div>';
    }

    async function cyclePart(i) {
        const cur = partOf(i);
        const next = cur === 'both' ? 'A' : cur === 'A' ? 'B' : 'both';
        await fetch('/api/duet/assign', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ trackKey: duetTrackKey, index: i, part: next })
        });
        refreshDuet();
    }

    function autoSplitHeuristic(texts) {
        const isParen = t => /^\(.*\)$/.test(t.trim());
        const parenIdx = [];
        texts.forEach((t, i) => { if (isParen(t)) parenIdx.push(i); });
        if (texts.length < 6 || parenIdx.length < 2) return null;
        if (parenIdx.length / texts.length > 0.7) return null;
        const parts = {};
        parenIdx.forEach(i => parts[i] = 'B');
        return parts;
    }
    async function autoSplit(manual) {
        if (!duetTrackKey || !duetParsed.length) return;
        const parts = autoSplitHeuristic(duetParsed);
        if (!parts) {
            if (manual) alert('No clear two-part pattern found in these lyrics.');
            return false;
        }
        await fetch('/api/duet/setparts', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ trackKey: duetTrackKey, parts })
        });
        refreshDuet();
        return true;
    }
    async function clearDuetParts() {
        if (!confirm('Clear all part assignments for this song?')) return;
        await fetch('/api/duet/clear', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ trackKey: duetTrackKey })
        });
        refreshDuet();
    }

    async function joinSession() {
        const code = document.getElementById('join-code').value.trim();
        const name = document.getElementById('join-name').value.trim();
        const err = document.getElementById('join-error');
        err.style.display = 'none';
        if (!code || !name) { err.innerText = 'Enter the code and your name.'; err.style.display = ''; return; }
        try {
            const res = await fetch('/api/session/join', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ code, name })
            });
            const data = await res.json();
            if (!res.ok) { err.innerText = data.error || 'Could not join.'; err.style.display = ''; return; }
            localStorage.setItem('linked_name', data.name);
            if (data.singer) setSinger(data.singer);
            syncJoinUI();
        } catch (e) { err.innerText = 'Could not reach the server.'; err.style.display = ''; }
    }
    async function leaveSession() {
        const name = localStorage.getItem('linked_name');
        if (name) await fetch('/api/session/leave', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name })
        });
        localStorage.removeItem('linked_name');
        syncJoinUI();
    }
    function syncJoinUI() {
        const name = localStorage.getItem('linked_name');
        document.getElementById('join-card').style.display = name ? 'none' : '';
        document.getElementById('linked-bar').style.display = name ? '' : 'none';
        document.getElementById('duet-view').style.display = name ? '' : 'none';
        if (name) document.getElementById('linked-name').innerText = name;
        syncSingerBtns();
    }
    syncJoinUI();
    syncSingerBtns();

    refreshDuet();
    setInterval(refreshDuet, 2000);
    setInterval(renderLive, 500);
</script>
</body>
</html>
