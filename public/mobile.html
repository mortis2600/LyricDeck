<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>LyricDeck</title>
<style>
  :root { --green: #1DB954; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0; background: #0a0a0a; color: #eee;
    font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
    display: flex; flex-direction: column; overflow: hidden;
    padding-top: env(safe-area-inset-top);
  }
  #topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 16px; border-bottom: 1px solid #1c1c1c; flex-shrink: 0;
  }
  #topbar .brand { font-weight: 800; font-size: 1rem; letter-spacing: .5px; }
  #topbar .brand span { color: var(--green); }
  #gear { background: none; border: none; color: #888; font-size: 1.3rem; cursor: pointer; padding: 4px 8px; }
  #np {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 16px; border-bottom: 1px solid #1c1c1c; flex-shrink: 0;
  }
  #np .meta { min-width: 0; flex: 1; }
  #np .title { font-weight: 700; font-size: .95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #np .artist { color: #999; font-size: .82rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #np .live { color: var(--green); font-size: .7rem; font-weight: 700; letter-spacing: 1px; flex-shrink: 0; }
  #np .src { color: #666; font-size: .7rem; flex-shrink: 0; }
  #lyrics {
    flex: 1; overflow-y: auto; padding: 24px 20px 40vh;
    -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
  }
  .line {
    font-size: 1.25rem; line-height: 1.5; color: #555; margin: 0 0 14px;
    transition: color .25s, transform .25s; font-weight: 500;
  }
  .line.active { color: #fff; transform: scale(1.04); transform-origin: left center; font-weight: 700; }
  .line.past { color: #777; }
  #empty {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: #666; text-align: center; padding: 0 32px; gap: 10px;
  }
  #empty .big { font-size: 2.4rem; }
  .sheet {
    position: fixed; inset: 0; background: rgba(0,0,0,.92); z-index: 50;
    display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .sheet .box { width: 100%; max-width: 420px; background: #141414; border: 1px solid #2a2a2a; border-radius: 16px; padding: 24px; }
  .sheet h2 { margin: 0 0 6px; font-size: 1.15rem; }
  .sheet p { color: #888; font-size: .88rem; margin: 0 0 16px; line-height: 1.5; }
  .sheet input {
    width: 100%; background: #0a0a0a; border: 1px solid #333; border-radius: 10px;
    color: #eee; padding: 13px; font-size: 1rem; margin-bottom: 14px;
  }
  .sheet button {
    width: 100%; padding: 14px; border: none; border-radius: 10px;
    background: var(--green); color: #000; font-size: 1rem; font-weight: 700; cursor: pointer;
  }
  .sheet button.ghost { background: none; color: #888; margin-top: 8px; }
  .seg { display: flex; gap: 8px; margin-bottom: 16px; }
  .seg button { flex: 1; padding: 10px; border-radius: 10px; border: 2px solid #2a2a2a; background: none; color: #888; font-weight: 700; cursor: pointer; }
  .seg button.on { border-color: var(--green); color: #fff; }
  .hidden { display: none !important; }
</style>
</head>
<body>
  <div id="topbar">
    <div class="brand">Lyric<span>Deck</span></div>
    <button id="gear" aria-label="Settings">⚙</button>
  </div>
  <div id="np" class="hidden">
    <div class="meta">
      <div class="title" id="np-title">—</div>
      <div class="artist" id="np-artist">—</div>
    </div>
    <div class="src" id="np-src"></div>
    <div class="live">● LIVE</div>
  </div>
  <div id="lyrics" class="hidden"></div>
  <div id="empty">
    <div class="big">🎵</div>
    <div id="empty-text">Play something on this phone<br>and the lyrics will appear here.</div>
  </div>

  <!-- permission onboarding (standalone mode) -->
  <div id="perm" class="sheet hidden">
    <div class="box">
      <h2>See what's playing</h2>
      <p>LyricDeck reads the current track from your phone so it can fetch the lyrics. Grant <b>Notification Access</b> on the next screen, then come back.</p>
      <button id="grant-btn">Grant access</button>
    </div>
  </div>

  <!-- settings -->
  <div id="settings" class="sheet hidden">
    <div class="box">
      <h2>Settings</h2>
      <p>Where should lyrics follow?</p>
      <div class="seg" id="mode-seg">
        <button data-m="standalone">This phone</button>
        <button data-m="server">LyricDeck server</button>
      </div>
      <div id="server-wrap" class="hidden">
        <input id="server-url" type="url" placeholder="https://your-server.ts.net" autocapitalize="off" autocorrect="off">
      </div>
      <button id="save-settings">Save</button>
      <button id="close-settings" class="ghost">Cancel</button>
    </div>
  </div>

<script>
const $ = id => document.getElementById(id);
const LS_MODE = 'ld_mobile_mode';      // 'standalone' | 'server'
const LS_SERVER = 'ld_mobile_server';
const isApp = !!window.Capacitor;

let mode = localStorage.getItem(LS_MODE) || (isApp ? 'standalone' : 'server');
let serverUrl = (localStorage.getItem(LS_SERVER) || '').replace(/\/$/, '');
let lines = [], activeIdx = -1, lastTrackKey = '';
let lastStateAt = 0, lastOffsetMs = 0;
let permGranted = false;

const MediaSession = () => (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.MediaSession) || null;

function parseLRC(lrc) {
  const out = [];
  for (const ln of String(lrc || '').split('\n')) {
    const m = ln.match(/\[(\d+):(\d+(?:\.\d+)?)\](.*)/);
    if (m && m[3].trim()) out.push({ t: (+m[1]) * 60 + (+m[2]), text: m[3].trim() });
  }
  return out.sort((a, b) => a.t - b.t);
}
function renderLyrics() {
  const box = $('lyrics');
  box.innerHTML = '';
  lines.forEach((l, i) => {
    const d = document.createElement('div');
    d.className = 'line'; d.textContent = l.text; d.id = 'line-' + i;
    box.appendChild(d);
  });
  activeIdx = -1;
}
function currentMs() { return lastOffsetMs + (Date.now() - lastStateAt); }
function tick() {
  requestAnimationFrame(tick);
  if (!lines.length) return;
  const t = currentMs() / 1000;
  let idx = -1;
  for (let i = 0; i < lines.length; i++) if (lines[i].t <= t) idx = i;
  if (idx !== activeIdx) {
    activeIdx = idx;
    document.querySelectorAll('.line').forEach((el, i) => {
      el.classList.toggle('active', i === idx);
      el.classList.toggle('past', i < idx);
    });
    const active = $('line-' + idx);
    if (active) active.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
}
function showTrack(title, artist, srcLabel) {
  $('np').classList.remove('hidden');
  $('empty').classList.add('hidden');
  $('lyrics').classList.remove('hidden');
  $('np-title').textContent = title || 'Unknown';
  $('np-artist').textContent = artist || '';
  $('np-src').textContent = srcLabel || '';
}
function showEmpty(msg) {
  $('np').classList.add('hidden');
  $('lyrics').classList.add('hidden');
  $('empty').classList.remove('hidden');
  if (msg) $('empty-text').innerHTML = msg;
  lines = []; lastTrackKey = '';
}
function setLyrics(lyricData, trackKey) {
  if (!lyricData) return;
  if (trackKey !== lastTrackKey || (lines.length === 0 && (lyricData.synced || lyricData.plain))) {
    lastTrackKey = trackKey;
    if (lyricData.synced) {
      lines = parseLRC(lyricData.synced);
      renderLyrics();
    } else if (lyricData.plain) {
      lines = [];
      const box = $('lyrics');
      box.innerHTML = '';
      const d = document.createElement('div');
      d.className = 'line'; d.style.color = '#999'; d.style.whiteSpace = 'pre-line';
      d.textContent = lyricData.plain;
      box.appendChild(d);
    } else {
      lines = [];
      const box = $('lyrics');
      box.innerHTML = '';
      const d = document.createElement('div');
      d.className = 'line'; d.style.color = '#555'; d.style.textAlign = 'center';
      d.style.marginTop = '40px';
      d.textContent = 'No lyrics found for this track.';
      box.appendChild(d);
    }
    $('lyrics').scrollTop = 0;
  }
}

/* ---------- standalone: phone media session + direct LRCLib ---------- */
async function checkPerm() {
  const p = MediaSession();
  if (!p) return false;
  try {
    const r = await p.hasPermission();
    permGranted = !!r.granted;
  } catch (e) { permGranted = false; }
  $('perm').classList.toggle('hidden', permGranted);
  return permGranted;
}
$('grant-btn').onclick = async () => {
  const p = MediaSession();
  if (p) { try { await p.openSettings(); } catch (e) {} }
};
async function fetchLrclib(title, artist, durationMs) {
  const durSec = durationMs > 0 ? Math.round(durationMs / 1000) : 0;
  // 1. exact match
  try {
    const q = new URLSearchParams({ track_name: title, artist_name: artist || '' });
    if (durSec) q.append('duration', durSec);
    const r = await fetch('https://lrclib.net/api/get?' + q.toString());
    if (r.ok) {
      const j = await r.json();
      if (j.syncedLyrics) return { synced: j.syncedLyrics, plain: null };
      if (j.plainLyrics) return { synced: null, plain: j.plainLyrics };
    }
  } catch (e) {}
  // 2. search fallback (cleaned title first, then raw)
  const cleanTitle = title.replace(/\b(19|20)\d{2}\b/g, '').replace(/[\(\[].*?[\)\]]/g, '').trim();
  const queries = [`${artist} ${cleanTitle}`, `${artist} ${title}`].filter((v, i, a) => v.trim() && a.indexOf(v) === i);
  for (const qStr of queries) {
    try {
      const r = await fetch('https://lrclib.net/api/search?' + new URLSearchParams({ q: qStr }));
      if (!r.ok) continue;
      const results = await r.json();
      if (!results.length) continue;
      const synced = results.filter(x => x.syncedLyrics);
      if (synced.length) {
        synced.sort((a, b) => Math.abs((a.duration || 0) - durSec) - Math.abs((b.duration || 0) - durSec));
        return { synced: synced[0].syncedLyrics, plain: null };
      }
      const plain = results.filter(x => x.plainLyrics);
      if (plain.length) return { synced: null, plain: plain[0].plainLyrics };
    } catch (e) {}
  }
  return { synced: null, plain: null };
}
async function pollStandalone() {
  const p = MediaSession();
  if (!p) { showEmpty('Media plugin not available.'); return; }
  if (!await checkPerm()) return;
  let t;
  try { t = await p.getCurrentTrack(); } catch (e) { return; }
  if (!t || !t.playing || !t.title) {
    showEmpty('Play something on this phone<br>and the lyrics will appear here.');
    return;
  }
  showTrack(t.title, t.artist, t.package ? t.package.split('.').pop() : '');
  // interpolate position locally between polls
  lastOffsetMs = (t.positionMs || 0);
  lastStateAt = t.positionTime || Date.now();
  const key = (t.artist || '') + ' - ' + t.title;
  if (key !== lastTrackKey || lines.length === 0) {
    try {
      const lyricData = await fetchLrclib(t.title, t.artist, t.durationMs);
      setLyrics(lyricData, key);
    } catch (e) { /* keep trying */ }
  }
}

/* ---------- server mode: follow the LyricDeck server ---------- */
async function pollServer() {
  if (!serverUrl) {
    showEmpty('No server set.<br>Tap ⚙ to enter your LyricDeck server address.');
    return;
  }
  try {
    const r = await fetch(serverUrl + '/api/party/state');
    if (!r.ok) throw new Error('bad');
    const s = await r.json();
    lastStateAt = Date.now();
    if (!s.playing) { showEmpty(); return; }
    showTrack(s.title, s.artist, 'server');
    lastOffsetMs = s.offsetMs || 0;
    const key = (s.artist || '') + ' - ' + (s.title || '');
    setLyrics(s.syncedLyrics ? { synced: s.syncedLyrics, plain: null } : null, key);
  } catch (e) { /* keep last state, retry */ }
}

function poll() { return mode === 'standalone' ? pollStandalone() : pollServer(); }

/* ---------- settings ---------- */
function syncSeg() {
  document.querySelectorAll('#mode-seg button').forEach(b =>
    b.classList.toggle('on', b.dataset.m === mode));
  $('server-wrap').classList.toggle('hidden', mode !== 'server');
}
document.querySelectorAll('#mode-seg button').forEach(b =>
  b.onclick = () => { mode = b.dataset.m; syncSeg(); });
$('gear').onclick = () => {
  $('server-url').value = serverUrl;
  syncSeg();
  $('settings').classList.remove('hidden');
};
$('close-settings').onclick = () => $('settings').classList.add('hidden');
$('save-settings').onclick = () => {
  const v = $('server-url').value.trim().replace(/\/$/, '');
  if (mode === 'server' && !v) return;
  serverUrl = v;
  localStorage.setItem(LS_MODE, mode);
  localStorage.setItem(LS_SERVER, v);
  $('settings').classList.add('hidden');
  lastTrackKey = ''; lines = [];
  poll();
};

/* ---------- boot ---------- */
if (mode === 'server' && !serverUrl && !isApp) {
  // browser user with no server yet: prompt via settings
  $('gear').click();
}
setInterval(poll, 2000);
poll();
requestAnimationFrame(tick);
// re-check permission when returning from Settings
document.addEventListener('resume', checkPerm);
</script>
</body>
</html>
